name: weather_data_warehouse
version: "1.0.0"
config-version: 2

profile: weather_data_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Days of history used as the baseline for anomaly detection.
  anomaly_window_days: 30
  # A day is flagged when its mean temperature is this many standard deviations from the baseline.
  anomaly_z_threshold: 2.5

models:
  weather_data_warehouse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
