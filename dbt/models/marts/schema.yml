version: 2

models:
  - name: dim_city
    description: City dimension with location, region and data coverage.
    columns:
      - name: city
        tests: [unique, not_null]
      - name: region
        tests:
          - accepted_values:
              values: ["North", "Central", "South"]

  - name: fct_daily_weather
    description: Daily weather facts per city with a 7-day rolling average.
    columns:
      - name: weather_day_id
        tests: [unique, not_null]
      - name: city
        tests:
          - relationships:
              to: ref('dim_city')
              field: city

  - name: mart_city_monthly
    description: Monthly temperature, rainfall and humidity summary per city.
    columns:
      - name: city
        tests: [not_null]
      - name: rainy_days
        tests:
          - value_in_range:
              min_value: 0
              max_value: 31

  - name: mart_temperature_anomalies
    description: Days where mean temperature deviates from the trailing baseline by more than the z-score threshold.
    columns:
      - name: weather_day_id
        tests: [unique, not_null]
      - name: anomaly_type
        tests:
          - not_null
          - accepted_values:
              values: ["HEAT_ANOMALY", "COLD_ANOMALY"]
